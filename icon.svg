<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2185D0"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#brandGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Outer Energy Ring / Gear motif -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#brandGrad)" stroke-width="18" stroke-dasharray="60 20" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="110" fill="#0F172A" stroke="#334155" stroke-width="6"/>

  <!-- Lightning Bolt / Energy Symbol -->
  <path d="M276 96 L160 272 H256 L236 416 L352 240 H256 Z" fill="url(#boltGrad)" filter="url(#glow)"/>

  <!-- Brand Typography Badge -->
  <rect x="156" y="380" width="200" height="44" rx="22" fill="#2185D0"/>
  <text x="256" y="410" font-family="'Inter', 'Helvetica Neue', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">BREL</text>
</svg>
