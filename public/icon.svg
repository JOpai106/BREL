<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#258fe6"/>
      <stop offset="50%" stop-color="#2185D0"/>
      <stop offset="100%" stop-color="#166dbf"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b3863" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with slight squircle for modern OS display -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Official BREL ENERGIE Symbol (Scaled & Centered in the 80% Safe Zone) -->
  <g transform="translate(96, 96) scale(3.2)" filter="url(#subtleShadow)">
    <!-- Arc Stator / Generator Casing -->
    <path 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="6" 
      stroke-linecap="round" 
      d="M35 75 A35 35 0 1 1 65 75" 
    />
    
    <!-- Generator Base Mounts -->
    <path 
      fill="#FFFFFF" 
      stroke="#FFFFFF" 
      stroke-width="2" 
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M30 65 L40 65 L40 85 L30 85 Z M25 70 L30 70 M40 70 L45 70" 
    />
    
    <!-- Electric Lightning Core -->
    <path 
      fill="#FFFFFF" 
      stroke="#FFFFFF"
      stroke-width="1.5"
      stroke-linejoin="round"
      d="M55 25 L35 55 H45 L40 75 L65 45 H55 Z" 
    />
  </g>
</svg>